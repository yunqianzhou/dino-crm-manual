验报告</button></div><div><button class="module">订单管理</button><button class="sub">O-01<!-- --> <!-- -->如何查询一笔订单</button><button class="sub">O-02<!-- --> <!-- -->如何导出订单列表</button></div><div><button class="module">系统管理</button><button class="sub">A-01<!-- --> <!-- -->谁可以配置角色和权限</button></div><p>随手查</p><button class="nav">常见问题</button><footer>已发布内容<br/>最后更新：2026-09-29</footer></aside><section class="workspace"><header><div class="crumb">Dino CRM 操作手册<!-- --> <b>/</b> <!-- -->手册首页</div><div class="tools"><button class="toc">☰ 目录</button><div class="search"><input aria-label="搜索操作、问题或模块…" placeholder="搜索操作、问题或模块…" value=""/></div><button class="lang">English</button></div></header><div class="content"><section class="trainingBanner"><div><span>2026.09.30 · <!-- -->操作培训</span><h2>营销中心配置操作手册</h2><p>渠道 → SKU 与价格 → 优惠码 → 落地页 → 正式链接</p></div><button>开始培训<!-- --> →</button></section><section class="hero"><div><span>— <!-- -->一线伙伴操作手册</span><h1>需要操作时，<br/>马上找到答案。</h1><p>按任务、功能模块或问题搜索。你不需要理解系统设计，只需完成当前工作。</p><button>从领取线索开始<!-- --> →</button></div><div class="orb"></div></section><section class="cards"><h2>销售核心链路</h2><button><span>S-01</span><b>如何领取一条新线索</b><p>线索通常由系统自动分配；需要从待领取列表手动领取时，按以下步骤操作。</p><em>查看步骤<!-- --> →</em></button><button><span>S-02</span><b>如何外呼并留下通话小结</b><p>通过CRM拨打客户电话并保存通话结果。首次登录电话条的销售，请先完成下方的首次使用设置。</p><em>查看步骤<!-- --> →</em></button><button><span>S-03</span><b>如何记录一次跟进</b><p>把客户反馈、下一步动作和回访时间留在CRM。</p><em>查看步骤<!-- --> →</em></button><button><span>S-04</span><b>如何转分配或退回公海</b><p>将线索交给其他同事，或归还公共线索池。</p><em>查看步骤<!-- --> →</em></button><button><span>S-05</span><b>如何查看通话记录</b><p>按客户或通话结果回看已经保存的外呼记录。</p><em>查看步骤<!-- --> →</em></button></section><section class="cards marketingCards"><h2>营销中心 · 按任务查阅</h2><button><span>M-00</span><b>营销中心配置总览与培训顺序</b><p>从建立渠道到生成可外发链接，一次看清配置顺序。2026-09-30 培训可按本章及 M-01～M-09 逐项演练。</p><em>查看步骤<!-- --> →</em></button><button><span>M-01</span><b>培训前准备：账号、权限与配置资料</b><p>先准备正确的账号、业务线、渠道信息和商品价格，避免现场配置到一半被阻断。</p><em>查看步骤<!-- --> →</em></button><button><span>M-02</span><b>如何新增和维护渠道</b><p>先建立可复用的渠道，再为不同投放创建落地页。渠道码由系统生成，不需要手填。</p><em>查看步骤<!-- --> →</em></button><button><span>M-03</span><b>如何查询并核对可售 SKU</b><p>SKU 是商品包的销售配置。营销中心只查询已有商品，商品信息由商品系统维护。</p><em>查看步骤<!-- --> →</em></button><button><span>M-04</span><b>如何配置渠道 SKU 关联与售卖价格</b><p>一个渠道只维护一套关联；先批量加入商品，再逐项设置原价、折扣或立减。</p><em>查看步骤<!-- --> →</em></button><button><span>M-05</span><b>如何设置 Promo Code 及使用数量</b><p>一套渠道 SKU 关联共用一个系统优惠码；优惠金额按每个 SKU 的规则计算。</p><em>查看步骤<!-- --> →</em></button><button><span>M-06</span><b>如何创建线索搜集页</b><p>用于获客留资，只配置渠道与页面；不要求渠道已关联 SKU，也不使用 Promo Code。</p><em>查看步骤<!-- --> →</em></button><button><span>M-07</span><b>如何创建支付落地页</b><p>支付页展示该渠道关联的全部 SKU，并统一选择是否带入 Promo Code。</p><em>查看步骤<!-- --> →</em></button><button><span>M-08</span><b>如何查找、编辑和核对正式链接</b><p>通过名称、渠道码或 LP ID 找到页面，查看详情与历史，再复制正确的正式链接。</p><em>查看步骤<!-- --> →</em></button><button><span>M-09</span><b>培训演练、验收清单与常见问题</b><p>用一个渠道、两类页面跑通配置；重点练习优惠切换与最终链接核对。</p><em>查看步骤<!-- --> →</em></button></section><div class="source">营销中心章节已按 2026-09-29 在线原型核对；其他章节保留原有操作说明。</div></div></section></main></div><script type="module" src="./assets/manual-35116b2c9c90.js"></script></body></html>
